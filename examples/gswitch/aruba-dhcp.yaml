apiVersion: cli-emulator/v1
# NOCDEV-22469: 10x compressed boot; record timestamps retain the original clock.
# Missing DHCP cycles between pasted excerpts are synthetic; MAC/IP are sanitized.
# Readiness is closed at time zero, including on reload.
