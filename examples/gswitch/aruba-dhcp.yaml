# Phase-relative noise also reproduces the collisions for a late console login.
# These are kernel/console messages: no CLI-monitor switch can suppress them.
triggers:
  - on: login:password
    after: 20ms
    event: {kind: log, route: session, source: kernel, policy: raw, text: "ble_ready NOT present @init ...."}
  - on: authenticated
    event:
      kind: log
      route: session
      source: cli
      policy: redraw
      text: "Warning: CLI module is running in a degraded state.  Configuration, write memory, and support command are disabled; please debug with caution."
  - on: authenticated
    after: 100ms
    event:
      kind: log
      route: console
      source: dhcp
      policy: raw
      text: |
        Jan  1 00:03:35 udhcpc[4575]: send_discover: pkt num 0, secs 46080
        Jan  1 00:03:35 udhcpc[4575]: Sending discover...
